<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Cedar Ridge Rimrock 2-person tent</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/product.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>
    <main class="divider">
      <nav class="breadcrumbs" aria-label="Breadcrumb"></nav>
      <section class="product-detail" hidden>
        <h3 id="productName"></h3>
        <h2 class="divider" id="productNameWithoutBrand"></h2>
        <img id="productImage" class="divider" src="" alt="" />
        <div id="imageOptions" class="image-options" hidden></div>
        <p class="product-card_price" id="productRetailPrice"></p>
        <p class="product-card_price" id="discountPercentage"></p>
        <p class="product-card__price" id="productFinalPrice"></p>
        <p class="product__color" id="productColorName"></p>
        <div id="colorOptions" class="color-options"></div>
        <p class="product__description" id="productDescriptionHtmlSimple"></p>
        <div class="product-detail__add">
          <button id="addToWishList" type="button">Add to Wish List</button>
          <button id="addToCart" data-id="">Add to Cart</button>
        </div>
      </section>
      <section class="recommendations" hidden>
        <h2>Consider the following</h2>
        <ul id="recommendedProducts" class="product-list"></ul>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
